
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tía Koko Delicias</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #fff8f0;
            color: #333;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: #8b3a2b;
            color: white;
        }

        header h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .productos {
            padding: 30px;
            max-width: 1100px;
            margin: auto;
        }

        .producto {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,.1);
        }

        .boton {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 15px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>

    <h1>TÍA KOKO DELICIAS</h1>

    <p>Comida casera hecha con amor ❤️</p>

    <a class="boton"
       href="https://wa.me/TUNUMERO">
       PEDIR POR WHATSAPP
    </a>

</header>

<section class="productos">

    <h2>Nuestro catálogo</h2>

    <div class="producto">
        <h3>Empanadas</h3>
        <p>Deliciosas empanadas caseras.</p>
    </div>

    <div class="producto">
        <h3>Tartas</h3>
        <p>Variedad de tartas caseras.</p>
    </div>

    <div class="producto">
        <h3>Pizzas</h3>
        <p>Pizzas a la piedra.</p>
    </div>

    <div class="producto">
        <h3>Postres</h3>
        <p>Brownies, cookies, alfajores y mucho más.</p>
    </div>

</section>

</body>
</html>
